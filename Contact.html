
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">Amir <span>Areb</span></a>
<nav class="navbar">
  <a class="active" href="./index.html">Home</a>
  <a href="./About.html">About</a>
  <a href="./Skills.html">Skills</a>
  <a href="./Service.html">Services</a>
  <a class="contact-btn" href="./#">Contact</a>
</nav>
    
  </header>

  <main class="container">

    <section class="intro">
      <p class="eyebrow">GET IN TOUCH</p>
      <h1>Let's Work <span>Together</span></h1>
      <p class="subtitle">
        Have a project in mind? Let's build something great.
      </p>
    </section>

    <section class="contact-cards">

      <a href="mailto:your-email@gmail.com" class="contact-card">
        <div class="icon"><i class="fa-regular fa-envelope"></i></div>
        <h2>Email</h2>
        <p>amirareb67@gmail.com</p>
      </a>

      <a href="tel:+251955893878" class="contact-card">
        <div class="icon"><i class="fa-solid fa-phone"></i></div>
        <h2>Phone</h2>
        <p>+251 955893878</p>
      </a>

      <a href="https://t.me/yourusername" target="_blank"
         rel="noopener noreferrer" class="contact-card">
        <div class="icon"><i class="fa-brands fa-telegram"></i></div>
        <h2>Telegram</h2>
        <p>@Amir_Areb</p>
      </a>

      <a href="https://instagram.com/yourusername" target="_blank"
         rel="noopener noreferrer" class="contact-card">
        <div class="icon"><i class="fa-brands fa-instagram"></i></div>
        <h2>Instagram</h2>
        <p>amir_areb7</p>
      </a>

    </section>

    <section class="form-card">
      <form id="contactForm">

        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name"
                 placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" name="email"
                 placeholder="Enter your email" required>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input type="text" id="subject" name="subject"
                 placeholder="Enter subject" required>
        </div>

        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea id="message" name="message"
                    placeholder="Write your message here..."
                    rows="5" required></textarea>
        </div>

        <button type="submit" class="send-btn">
          Send Message <i class="fa-solid fa-arrow-right"></i>
        </button>

        <p id="formStatus" role="status" aria-live="polite"></p>

      </form>
    </section>

  </main>

  <footer>
    <p>© <span id="year"></span> Amir Areb. All rights reserved.</p>
  </footer>

  <script src="contact.js"></script>
